name: Reorganize LeetCode Solutions

on:
  workflow_dispatch:

jobs:
  reorganize:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reorganize folders
        run: |
          echo "Creating clean structure..."
          mkdir -p problems/Easy problems/Medium problems/Hard

          echo "Moving existing problem folders..."
          for dir in [0-9][0-9][0-9][0-9]-*; do
            if [ -d "$dir" ]; then
              echo "Moving $dir → problems/Easy/"
              mv "$dir" problems/Easy/
            fi
          done

          # Catch any other numbered folders
          for dir in [0-9]*-*; do
            if [ -d "$dir" ] && [[ ! "$dir" =~ ^problems ]]; then
              echo "Moving $dir → problems/Easy/"
              mv "$dir" problems/Easy/
            fi
          done

      - name: Fix README links
        run: |
          if [ -f README.md ]; then
            echo "Updating links in README.md..."
            
            # Replace old paths with new paths
            # Example: /0035-search-insert-position → /problems/Easy/0035-search-insert-position
            sed -i -E 's|(tree/master/)([0-9]+-[a-z0-9-]+)|\1problems/Easy/\2|g' README.md
            sed -i -E 's|(tree/main/)([0-9]+-[a-z0-9-]+)|\1problems/Easy/\2|g' README.md
            
            # Also fix relative links if any
            sed -i -E 's|\./([0-9]+-[a-z0-9-]+)|\./problems/Easy/\1|g' README.md
            sed -i -E 's|\(([0-9]+-[a-z0-9-]+)\)|(problems/Easy/\1)|g' README.md
            
            echo "README links updated."
          else
            echo "No README.md found"
          fi

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add .
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: reorganize solutions into problems/Easy + fix README links"
            git push
          fi
